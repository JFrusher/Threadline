name: example-release
on:
  push:
    tags: ["example-v*"]
permissions: {}
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended fonts-dejavu-core
      - run: npm install -g @mermaid-js/mermaid-cli@11.4.2
      - run: pip install . pytest
      - run: pytest tests --junitxml=tool-validation.xml
      - run: pytest examples/breathe-triage --junitxml=junit.xml
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: examples/breathe-triage
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - run: >-
          threadline build examples/breathe-triage --release "$GITHUB_REF_NAME" --junit junit.xml --sbom sbom.cdx.json
          --osv --tool-validation tool-validation.xml --version "$GITHUB_REF_NAME" --out dist/technical-file.pdf
          --trust-root 87785d9a6e5fd9fa56d7f36ca3256c91d349238a
      - run: cp junit.xml sbom.cdx.json tool-validation.xml dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release
          path: dist/
  publish:
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --title "Breathe-Triage example $GITHUB_REF_NAME" --notes "Fictional example device. Illustrative data."
        env:
          GH_TOKEN: ${{ github.token }}
