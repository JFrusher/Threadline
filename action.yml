name: Threadline check
description: Run Threadline rules on a QMS-as-code repository
inputs:
  path:
    description: Project root (directory holding threadline.yaml)
    default: "."
  junit:
    description: JUnit XML with verification evidence (empty = evidence rules skipped)
    default: ""
  base:
    description: Git ref to diff documents against (empty = TL-D02 skipped)
    default: ""
  trust-root:
    description: Commit whose signer registry is trusted; pass an admin-set variable, never a PR-controlled value
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      env:
        TL_PATH: ${{ inputs.path }}
        TL_JUNIT: ${{ inputs.junit }}
        TL_BASE: ${{ inputs.base }}
        TL_TRUST_ROOT: ${{ inputs.trust-root }}
      run: |
        args=("$TL_PATH")
        [ -n "$TL_JUNIT" ] && args+=(--junit "$TL_JUNIT")
        [ -n "$TL_BASE" ] && args+=(--base "$TL_BASE")
        [ -n "$TL_TRUST_ROOT" ] && args+=(--trust-root "$TL_TRUST_ROOT")
        threadline check --format github "${args[@]}"
