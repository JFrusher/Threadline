[project]
name = "threadline"
version = "0.0.1"
description = "QMS-as-code for Software as a Medical Device: traceability, risk, SOUP and technical file in git."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "ruamel.yaml>=0.18"]

[project.scripts]
threadline = "threadline.cli:main"

[project.entry-points.pytest11]
threadline = "threadline.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"
